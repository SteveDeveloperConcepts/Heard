appId: com.developerconcepts.stevenola
productName: SteveNola
copyright: Copyright © 2026 Steve Vaubell
directories:
  buildResources: build
  output: dist
# Ship the bundled app in out/ and the production dependencies; leave the rest of the project out.
# Keep every rule here: a `files` list under win: or mac: would replace this one, not add to it.
files:
  - '!{src,scripts,native}/**'
  - '!{README.md,electron.vite.config.ts,tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Transformers.js has its own copy of the browser speech engine and never loads this package.
  - '!**/node_modules/onnxruntime-web/**'
  # Only the speech engine for the platform and processor being built (each is built on its own OS).
  - '!**/node_modules/onnxruntime-node/bin/napi-v*/!(${platform})/**'
  - '!**/node_modules/onnxruntime-node/bin/napi-v*/${platform}/!(${arch})/**'
asar: true
# Native speech-recognition runtime (ONNX Runtime, used by the built-in transcription) can't load from inside the asar.
asarUnpack:
  - '**/node_modules/onnxruntime-node/**'
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
publish: null

win:
  target:
    - target: nsis
      arch: x64
  # Reports which programs are capturing from a microphone, for call detection.
  extraResources:
    - from: native/win/call-monitor.ps1
      to: call-monitor.ps1
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: SteveNola
  artifactName: SteveNola-Setup-${version}.${ext}

mac:
  category: public.app-category.productivity
  # Apple Silicon only: ONNX Runtime, which runs the built-in transcription, has no Intel Mac build.
  target:
    - target: dmg
      arch: arm64
  # Ad-hoc signature, so a downloaded copy can be opened with "Open Anyway" instead of being
  # reported as damaged. Remove this line once you sign with an Apple Developer ID certificate.
  identity: '-'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Call-detection helper, built by `npm run helper:mac`.
  extraResources:
    - from: build/mac/call-monitor
      to: call-monitor
  # macOS shows these strings in its permission prompts.
  extendInfo:
    NSMicrophoneUsageDescription: SteveNola transcribes your side of a meeting, only while you are recording.
    NSAudioCaptureUsageDescription: SteveNola transcribes the other participants' audio, only while you are recording.
  notarize: false
dmg:
  artifactName: SteveNola-${version}-${arch}.${ext}
