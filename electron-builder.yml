# The app was called SteveNola. The ID keeps that name so the Windows installer upgrades an
# installed SteveNola in place and its "start at login" entry and notifications keep working.
appId: com.developerconcepts.stevenola
productName: Heard
copyright: Copyright © 2026 Steve Vaubell
directories:
  buildResources: build
  output: dist
# Ship the bundled app in out/ and the production dependencies; leave the rest of the project out.
# Keep every rule here: a `files` list under win: or mac: would replace this one, not add to it.
files:
  - '!{src,scripts,native}/**'
  - '!{README.md,electron.vite.config.ts,electron-builder.adhoc.yml,tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Transformers.js has its own copy of the browser speech engine and never loads this package.
  - '!**/node_modules/onnxruntime-web/**'
  # Only the speech engine for the platform and processor being built (each is built on its own OS).
  - '!**/node_modules/onnxruntime-node/bin/napi-v*/!(${platform})/**'
  - '!**/node_modules/onnxruntime-node/bin/napi-v*/${platform}/!(${arch})/**'
asar: true
# Native speech-recognition runtime (ONNX Runtime, used by the built-in transcription) can't load from inside the asar.
asarUnpack:
  - '**/node_modules/onnxruntime-node/**'
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
# Where installed copies look for new versions (src/main/updater.ts). Builds never upload anything
# themselves (`--publish never` in package.json): the Release workflow attaches the latest*.yml and
# .blockmap files written next to the installers.
publish:
  provider: github
  owner: SteveDeveloperConcepts
  repo: Heard

win:
  target:
    - target: nsis
      arch: x64
  # Reports which programs are capturing from a microphone, for call detection.
  extraResources:
    - from: native/win/call-monitor.ps1
      to: call-monitor.ps1
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Heard
  artifactName: Heard-Setup-${version}.${ext}

mac:
  category: public.app-category.productivity
  # Apple Silicon only: ONNX Runtime, which runs the built-in transcription, has no Intel Mac build.
  # The disk image is what people download. Updates install from the zip.
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  artifactName: Heard-${version}-${arch}.${ext}
  # Signed with a Developer ID and notarised by the Release workflow ("One-time setup for releases"
  # in README.md). electron-builder notarises when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and
  # APPLE_TEAM_ID are set. `npm run dist:mac` builds without the certificate (electron-builder.adhoc.yml).
  hardenedRuntime: true
  # Gatekeeper only accepts the app once it's notarised, which comes after signing. The Release
  # workflow checks it then.
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signs the app as electron-builder would, except that the call-detection helper gets
  # build/entitlements.call-monitor.plist instead of Electron's entitlements.
  sign: ./scripts/sign-mac.mjs
  # Call-detection helper, built by `npm run helper:mac`.
  extraResources:
    - from: build/mac/call-monitor
      to: call-monitor
  # macOS shows these strings in its permission prompts.
  extendInfo:
    NSMicrophoneUsageDescription: Heard transcribes your side of a meeting, only while you are recording.
    NSAudioCaptureUsageDescription: Heard transcribes the other participants' audio, only while you are recording.
