name: Release

# Builds the Windows and Mac installers on GitHub's machines and publishes them as a GitHub release.
# `npm run release <version> "<what changed>"` starts it: it raises the version and pushes a tag whose
# message becomes the release's "What's new" (see "Publish a release" in README.md). Pushing a version
# tag by hand works too. The tag must match package.json, e.g. v0.1.0.
# Running it by hand from the Actions tab builds the installers without releasing them.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: dist:win
            installer: dist/Heard-Setup-*.exe
          - name: macOS
            os: macos-latest # Apple Silicon, with Xcode for the call-detection helper
            script: dist:mac
            installer: dist/Heard-*.dmg
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version. Update package.json or the tag."
            exit 1
          fi

      - run: npm ci

      # The dist scripts pass `--publish never`, so this only builds; the release job publishes.
      - name: Build the installer
        run: npm run ${{ matrix.script }}

      # Installed copies read latest.yml (Windows) or latest-mac.yml to find a new version, and the
      # Windows updater uses the .blockmap files to download only what changed. Without them, nobody
      # gets this release as an update.
      - name: Check the update files were written
        shell: bash
        run: ls dist/latest*.yml dist/*.blockmap

      - uses: actions/upload-artifact@v7
        with:
          name: Heard-${{ matrix.name }}
          path: |
            ${{ matrix.installer }}
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # For .github/release-notes.md and the tag's message.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          tag="refs/tags/$GITHUB_REF_NAME"
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          # An annotated tag's message, after its first line, becomes "What's new". actions/checkout
          # swaps an annotated tag for a plain one, so fetch the real tag to read its message.
          git fetch --quiet --force origin "$tag:$tag"
          if [ "$(git cat-file -t "$tag")" = tag ]; then
            whats_new=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
            if [ -n "$(printf '%s' "$whats_new" | tr -d '[:space:]')" ]; then
              printf "## What's new\n\n%s\n\n" "$whats_new" > "$notes"
            fi
          fi
          sed "s/<version>/$version/g" .github/release-notes.md >> "$notes"
          gh release create "$GITHUB_REF_NAME" installers/* --verify-tag \
            --title "Heard $GITHUB_REF_NAME" --notes-file "$notes" --generate-notes
