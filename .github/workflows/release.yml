name: Release

# Builds the Windows and Mac installers on GitHub's machines and publishes them as a GitHub release.
# Push a version tag to release (the tag must match package.json, e.g. v0.1.0):
#   git tag v0.1.0
#   git push origin v0.1.0
# Running it by hand from the Actions tab builds the installers without releasing them.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: dist:win
            installer: dist/Heard-Setup-*.exe
          - name: macOS
            os: macos-latest # Apple Silicon, with Xcode for the call-detection helper
            script: dist:mac
            installer: dist/Heard-*.dmg
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version. Update package.json or the tag."
            exit 1
          fi

      - run: npm ci

      # electron-builder.yml has `publish: null`, so this only builds; the release job publishes.
      - name: Build the installer
        run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v7
        with:
          name: Heard-${{ matrix.name }}
          path: ${{ matrix.installer }}
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          name: Heard ${{ github.ref_name }}
          files: installers/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Download

            - **Windows 10 or 11:** `Heard-Setup-*.exe`. The installer isn't code-signed yet, so Windows may say "Windows protected your PC". Click **More info**, then **Run anyway**.
            - **macOS 13 or later, Apple Silicon (M1 or newer):** `Heard-*-arm64.dmg`. Open it and drag Heard to Applications. The app isn't notarized by Apple yet, so the first time you open it macOS says it can't verify it. Click **Done**, open **System Settings → Privacy & Security**, and click **Open Anyway**.

            On first launch, add an API key for your AI in Settings. Your first recording downloads the speech model (about 130 MB); after that, transcription works offline.
