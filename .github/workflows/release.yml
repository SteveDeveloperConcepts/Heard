name: Release

# Builds the Windows and Mac installers on GitHub's machines, signs and notarises the Mac app, and
# publishes them as a GitHub release. `npm run release <version> "<what changed>"` starts it: it raises
# the version and pushes a tag whose message becomes the release's "What's new" (see "Publish a
# release" in README.md). Pushing a version tag by hand works too. The tag must match package.json,
# e.g. v0.1.0.
# Running it by hand from the Actions tab builds, signs and notarises the installers without
# releasing them.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest # Apple Silicon, with Xcode for the call-detection helper
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version. Update package.json or the tag."
            exit 1
          fi

      - run: npm ci

      # The builds pass `--publish never`, so they only build; the release job publishes.
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win

      # A Mac build without the Developer ID certificate could never update itself, so it must not be
      # released. electron-builder signs with the certificate in CSC_LINK, and notarises when the three
      # APPLE_ variables are set. See "One-time setup for releases" in README.md.
      - name: Build, sign, and notarise the Mac app
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for pair in MAC_CERTIFICATE=CSC_LINK MAC_CERTIFICATE_PASSWORD=CSC_KEY_PASSWORD APPLE_ID=APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD=APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID=APPLE_TEAM_ID; do
            secret=${pair%%=*}
            variable=${pair#*=}
            if [ -z "${!variable}" ]; then
              echo "::error::The repository secret $secret is missing, so the Mac app can't be signed and notarised. See \"One-time setup for releases\" in README.md."
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          npm run build
          npm run helper:mac
          npx electron-builder --mac --publish never

      # Every app must pass Gatekeeper with its notarisation ticket stapled: the one built, and the
      # copies in the zip (updates) and the disk image (downloads). The call-detection helper must be
      # signed on its own, with no entitlements (scripts/sign-mac.mjs), and start.
      - name: Check the Mac app is signed, notarised, and complete
        if: runner.os == 'macOS'
        run: |
          check_app() {
            echo "Checking $1"
            codesign --verify --deep --strict --verbose=2 "$1"
            spctl --assess --type execute --verbose=2 "$1"
            xcrun stapler validate "$1"
          }
          shopt -s nullglob
          apps=(dist/mac*/Heard.app)
          zips=(dist/Heard-*.zip)
          dmgs=(dist/Heard-*.dmg)
          if [ ${#apps[@]} = 0 ] || [ ${#zips[@]} = 0 ] || [ ${#dmgs[@]} = 0 ]; then
            echo "::error::The Mac build is missing its app, zip, or disk image in dist/."
            exit 1
          fi

          for app in "${apps[@]}"; do
            check_app "$app"
            helper="$app/Contents/Resources/call-monitor"
            if [ ! -x "$helper" ]; then
              echo "::error::$app has no call-detection helper. npm run helper:mac builds it."
              exit 1
            fi
            codesign --verify --strict --verbose=2 "$helper"
            codesign --display --verbose=2 "$helper"
            entitlements=$(codesign --display --entitlements - --xml "$helper" 2>/dev/null || true)
            echo "Entitlements: ${entitlements:-none}"
            if [[ $entitlements == *'<key>'* ]]; then
              echo "::error::The call-detection helper in $app was signed with entitlements it doesn't need. See scripts/sign-mac.mjs."
              exit 1
            fi
            # Under the hardened runtime, as it ships, it prints its first report straight away.
            "$helper" > "$RUNNER_TEMP/call-monitor.txt" &
            sleep 3
            kill "$!" 2>/dev/null || true
            if ! grep -q '"mode"' "$RUNNER_TEMP/call-monitor.txt"; then
              echo "::error::The call-detection helper in $app didn't start."
              exit 1
            fi
          done

          for zip in "${zips[@]}"; do
            dir=$(mktemp -d)
            ditto -x -k "$zip" "$dir"
            check_app "$dir/Heard.app"
          done

          for dmg in "${dmgs[@]}"; do
            dir=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$dir" "$dmg"
            check_app "$dir/Heard.app"
            hdiutil detach "$dir" || hdiutil detach -force "$dir"
          done

      # Installed copies read latest.yml (Windows) or latest-mac.yml to find a new version. Windows
      # installs from the installer and a Mac from the zip, and both use the .blockmap files to download
      # only what changed. Without these, nobody gets this release as an update.
      - name: Check the update files were written
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            ls dist/latest-mac.yml dist/Heard-*.zip dist/*.blockmap
            if ! grep -q '^ *- url: Heard-.*\.zip$' dist/latest-mac.yml; then
              echo "::error::latest-mac.yml doesn't list the zip, so Macs couldn't install this release."
              exit 1
            fi
          else
            ls dist/latest.yml dist/*.blockmap
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: Heard-${{ matrix.name }}
          path: |
            dist/Heard-Setup-*.exe
            dist/Heard-*.dmg
            dist/Heard-*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # For .github/release-notes.md and the tag's message.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          tag="refs/tags/$GITHUB_REF_NAME"
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          # An annotated tag's message, after its first line, becomes "What's new". actions/checkout
          # swaps an annotated tag for a plain one, so fetch the real tag to read its message.
          git fetch --quiet --force origin "$tag:$tag"
          if [ "$(git cat-file -t "$tag")" = tag ]; then
            whats_new=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
            if [ -n "$(printf '%s' "$whats_new" | tr -d '[:space:]')" ]; then
              printf "## What's new\n\n%s\n\n" "$whats_new" > "$notes"
            fi
          fi
          sed "s/<version>/$version/g" .github/release-notes.md >> "$notes"
          gh release create "$GITHUB_REF_NAME" installers/* --verify-tag \
            --title "Heard $GITHUB_REF_NAME" --notes-file "$notes" --generate-notes
